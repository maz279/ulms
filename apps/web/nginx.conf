# ULMS staff app — static serve + API reverse proxy (parity with the Vite
# dev proxy in vite.config.ts: browser sees one origin, no CORS dance).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — every staff route resolves to the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # real API (compose stack). Static assets are content-hashed — cache hard.
    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # payment-rail webhooks live at the root context on the api (05 §7)
    location /hooks/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|woff2?|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
