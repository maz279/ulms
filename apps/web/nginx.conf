# ULMS staff app — static serve + API reverse proxy (parity with the Vite
# dev proxy in vite.config.ts: browser sees one origin, no CORS dance).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # bank security-baseline headers (ZAP 10038 fail rule; prod TLS adds HSTS
    # at the ingress — plain HTTP inside compose must not set it)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA — every staff route resolves to the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # real API (compose stack). Static assets are content-hashed — cache hard.
    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # payment-rail webhooks live at the root context on the api (05 §7)
    location /hooks/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # actuator health for the CI post-deploy smoke + bank probes — served on
    # the api management port (9977) everywhere (compose + k3s); metrics ride
    # the same port, network-restricted, never proxied here
    location = /actuator/health {
        proxy_pass http://api:9977/actuator/health;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|woff2?|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
