{{- /* ULMS API deployment (R8) */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: { app: {{ .Release.Name }}-api }
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: {{ .Release.Name }}-api } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}{{ if .Values.global.imageRegistry }}/{{ end }}{{ .Values.api.image }}:{{ .Values.api.tag | default .Chart.AppVersion }}"
          ports: [{ containerPort: 8081, name: http }]
          env:
            - name: ULMS_DB_URL
              value: {{ .Values.api.env.ULMS_DB_URL | quote }}
            - name: ULMS_DB_USER
              value: {{ .Values.api.env.ULMS_DB_USER | quote }}
            - name: ULMS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: ULMS_DB_PASSWORD } }
            - name: ULMS_OIDC_ISSUER
              value: {{ .Values.api.env.ULMS_OIDC_ISSUER | quote }}
            - name: FINERACT_URL
              value: {{ .Values.api.env.FINERACT_URL | quote }}
            - name: FINERACT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: FINERACT_USER } }
            - name: FINERACT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: FINERACT_PASSWORD } }
            - name: ULMS_MINIO_ENDPOINT
              value: {{ .Values.api.env.ULMS_MINIO_ENDPOINT | quote }}
            - name: ULMS_MINIO_BUCKET
              value: {{ .Values.api.env.ULMS_MINIO_BUCKET | quote }}
            - name: ULMS_MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: ULMS_MINIO_ACCESS_KEY } }
            - name: ULMS_MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: ULMS_MINIO_SECRET_KEY } }
            - name: ULMS_RAILS_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: ULMS_RAILS_WEBHOOK_SECRET } }
            {{- if .Values.api.env.ULMS_CIB_BASE_URL }}
            - name: ULMS_CIB_BASE_URL
              value: {{ .Values.api.env.ULMS_CIB_BASE_URL | quote }}
            - name: ULMS_CIB_KEYSTORE
              value: {{ .Values.api.env.ULMS_CIB_KEYSTORE | quote }}
            - name: ULMS_CIB_KEYSTORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: ULMS_CIB_KEYSTORE_PASSWORD } }
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ .Values.api.probes.path }}, port: http }
            initialDelaySeconds: {{ .Values.api.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.periodSeconds }}
          livenessProbe:
            httpGet: { path: {{ .Values.api.probes.path }}, port: http }
            initialDelaySeconds: {{ .Values.api.probes.initialDelaySeconds | add 30 }}
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
