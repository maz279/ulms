        required: true
        content:
          application/json:
            schema: {type: object, required: [note], properties: {note: {type: string}}}
      responses:
        "200": {description: cleared entry, content: {application/json: {schema: {$ref: "#/components/schemas/WatchlistEntry"}}}}
        "409": {$ref: "#/components/responses/Problem"}
