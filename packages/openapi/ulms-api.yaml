      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}, {name: actionType, in: path, required: true, schema: {type: string, enum: [CALL, SMS, VISIT, NOTICE]}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [outcome], properties: {outcome: {type: string}, notes: {type: string}}}
      responses:
        "200": {description: action, content: {application/json: {schema: {type: object}}}}
    get:
      tags: [collections]
      summary: Action history for a loan (audit R1 — route existed undocumented)
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}, {name: actionType, in: path, required: true, schema: {type: string, enum: [CALL, SMS, VISIT, NOTICE]}}]
      responses:
        "200": {description: list envelope of past actions, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /collections/{loanId}/ptp:
    post:
      tags: [collections]
      summary: PTP promise (prototype F3 contextual form) — DPD/class snapshot at promise; kept/broken derives from payments
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [promisedAmountMinor, promisedOn, confidence], properties: {promisedAmountMinor: {type: integer}, promisedOn: {type: string, format: date}, confidence: {type: string, enum: [HIGH, MEDIUM, LOW]}, contactName: {type: string}, contactRelation: {type: string}, contactPhone: {type: string, description: masked in every projection (06 §5)}, remark: {type: string}}}
      responses:
        "200": {description: ptp (phone masked), content: {application/json: {schema: {$ref: "#/components/schemas/Ptp"}}}}
  /collections/ptp/{ptpId}/outcome:
    post:
      tags: [collections]
      summary: PTP state machine transition (PENDING→KEPT|BROKEN, terminal)
      parameters: [{name: ptpId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [kept], properties: {kept: {type: boolean}}}
      responses:
        "200": {description: ptp, content: {application/json: {schema: {$ref: "#/components/schemas/Ptp"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /collections/ptp/calendar:
    get:
      tags: [collections]
      summary: PTP calendar (promises in a date range)
      parameters: [{name: from, in: query, required: true, schema: {type: string, format: date}}, {name: to, in: query, required: true, schema: {type: string, format: date}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Ptp"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /collections/field-tasks:
    post:
      tags: [collections]
      summary: Assign a field-visit task (Expo sync contract, 03)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [loanId, assignedTo, dueOn], properties: {loanId: {type: string, format: uuid}, assignedTo: {type: string}, dueOn: {type: string, format: date}}}
      responses:
        "200": {description: task, content: {application/json: {schema: {$ref: "#/components/schemas/FieldTask"}}}}
    get:
      tags: [collections]
      summary: Open field tasks (due-date order)
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/FieldTask"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /collections/field-tasks/{taskId}/complete:
    post:
      tags: [collections]
      summary: Complete from mobile — server-wins status, append-only evidence (replays suppressed but evidence kept, 03)
      parameters: [{name: taskId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {evidence: {type: string}}}
      responses:
        "200": {description: task with evidence log, content: {application/json: {schema: {$ref: "#/components/schemas/FieldTask"}}}}
  /collections/dunning/queue:
    get:
      tags: [collections]
      summary: Dunning-ladder timer queue (03) — queued AUTO_QUEUED steps due for officer action
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/DunningStep"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /collections/dunning/run:
    post:
      tags: [collections]
      summary: Operator trigger for the nightly ladder pass (06:00) — queues next due SMS/CALL/VISIT per DPD bucket; PENDING PTPs suspend
      responses:
        "200": {description: summary, content: {application/json: {schema: {type: object, properties: {queued: {type: integer}}}}}}
  /collections/dunning/{actionId}/resolve:
    post:
      tags: [collections]
      summary: Officer acts a queued dunning step — outcome recorded, timer cleared
      parameters: [{name: actionId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [outcome], properties: {outcome: {type: string}, notes: {type: string}}}
      responses:
        "200": {description: action, content: {application/json: {schema: {$ref: "#/components/schemas/DunningStep"}}}}
  /collections/watchlist:
    get:
      tags: [collections]
      summary: Early-warning watchlist (Q1.4, PLAN-03) — OPEN rows by default (?status=CLEARED|ALL); nightly scan auto-adds STD-2 entries
      parameters: [{name: status, in: query, schema: {type: string, enum: [OPEN, CLEARED, ALL], default: OPEN}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/WatchlistEntry"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
    post:
      tags: [collections]
      summary: Put a loan on the watchlist (one OPEN row per loan; validated reason codes)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [loanId, reasonCode], properties: {loanId: {type: string, format: uuid}, reasonCode: {type: string, enum: [DPD_RISING, CHEQUE_BOUNCE, CIB_ALERT, FIELD_INTEL, BANKING_INACTIVITY, AUTO_STD2]}, note: {type: string}, reviewWithinDays: {type: integer, default: 7}}}
      responses:
        "200": {description: entry, content: {application/json: {schema: {$ref: "#/components/schemas/WatchlistEntry"}}}}
        "409": {$ref: "#/components/responses/Problem"}
