openapi: 3.0.3
info:
  title: ULMS API
  version: 1.7.0
  description: |
    Unisoft Loan Management System — public API (source of truth per PLANNING/05).
    Conventions: problem+json errors (stable `code`, registry docs/errors.md),
    Idempotency-Key on creating POSTs (replays return the original response
    with `Idempotent-Replay: true`, 48h window), list responses use the
    {data, meta} envelope, money is integer minor units, bilingual objects
    {en,bn} render ONE per request.
    Mutating routes are role-gated (403 ULMS-FORBIDDEN) — realm roles per 06 §1;
    the approval act() ladder-level check maps roles per the band table.
    v1.2 (P2): assessments (CIB/score/DBR/collateral), disbursements with dual
    authorization, compliance EOD/classification/calculator.
    v1.2.1: CIB file channel + 24-month repayment track + raw kept only in the
    encrypted object store (06 §5) + approver inbox.
    v1.3: optimistic concurrency (PATCH version ⇒ 409 ULMS-STATE-0002),
    collateral valuation history, application detail incl. workflow state,
    ?officer= list filter, CIB retry×5 + RB-05 alert on outage.
    v1.4 (P3): payments + rails (intent→redirect→HMAC webhook idempotent by
    UTR), schedules/statements (JSON+CSV), settle quotes, reschedules,
    collections (worklist/actions/PTP/field tasks), tax certificates,
    borrower portal projections.
    v1.4.1: ESCALATE approval action, dunning-ladder timers (queue/run/
    resolve), legal-case CRUD, collections interest waiver (Fineract
    adjustment), portal statement CSV download.
    v1.5.0 (P4/G4): regulatory returns pack — CL-1..CL-5 / CIB-S / CIB-C /
    CAR / EDW / ECL / LLF generation with WORM staging + sha256, preparer→
    checker→compliance sign-off chain, submission calendar, IFRS-9 ECL
    runway (snapshot + board), Basel CAR inputs, fee charges, and the
    portfolio reporting read model.
    v1.5.1 (P4 audit-G): provision JV to the Fineract GL (zero-sum, idempotent
    per run-date, drift ⇒ 409 + alert), compliance sign-off must be a
    DIFFERENT officer than the checker, packs now carry their WORM
    storage_key, and report definitions (the writer slice).
servers:
  - url: http://localhost:8081/api/v1
    description: local compose
tags: [{name: platform}, {name: customers}, {name: applications}, {name: approvals}, {name: assessments}, {name: disbursements}, {name: compliance}, {name: loans}, {name: payments}, {name: collections}, {name: portal}]
security: [{bearerAuth: []}]
paths:
  /actuator/health:
    get:
      tags: [platform]
      summary: Liveness/readiness (public)
      security: []
      responses: { "200": { description: ok } }
  /applications:
    get:
      tags: [applications]
      summary: List applications (pipeline; ?stage=&branch= filters)
      parameters:
        - {name: stage, in: query, schema: {type: string}}
        - {name: branch, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 25, maximum: 100}}
      responses:
        "200":
          description: paged list envelope
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApplicationList"}
    post:
      tags: [applications]
      summary: Draft application (wizard autosave creates the server draft); submit is a separate action
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApplicationDraft"}
      responses:
        "201":
          description: "drafted (replays carry Idempotent-Replay: true)"
          headers:
            Idempotent-Replay: {schema: {type: string, enum: ["true"]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Application"}
  /applications/{id}:
    get:
      tags: [applications]
      summary: Application detail incl. workflow state (03 — node/phase/SLA inline)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: detail, content: {application/json: {schema: {$ref: "#/components/schemas/Application"}}}}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [applications]
      summary: Autosave PATCH (07 §4) — only while stage=SCREENING; optional body `version` = optimistic lock (05 §4, stale ⇒ 409 ULMS-STATE-0002)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DraftPatch"}
      responses:
        "200": {description: updated, content: {application/json: {schema: {$ref: "#/components/schemas/Application"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /applications/{id}/submit:
    post:
      tags: [applications]
      summary: Submit → CIB pull → server-side scoring (DBR + versioned scorecard; AUTO_DECLINE rolls back to SCREENING) → CPV
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: stage CPV (proceed) or SCREENING (auto-declined — score persisted)}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /applications/{id}/cpv:
    post:
      tags: [applications]
      summary: CPV gate (03) — PASS starts the approval ladder; FAIL rolls back to SCREENING
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [passed], properties: {passed: {type: boolean}, notes: {type: string}}}
      responses:
        "200": {description: stage APPROVAL (pass) or SCREENING (fail), content: {application/json: {schema: {$ref: "#/components/schemas/Application"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /applications/{id}/documents:
    get:
      tags: [applications]
      summary: List application documents (metadata + checksums + scan status)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: list envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ApplicationDocument"}}
                  meta: {$ref: "#/components/schemas/Meta"}
    post:
      tags: [applications]
      summary: Upload document (multipart → object store; sha256 + virus-scan hook; identical (type,sha256) is idempotent)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {name: docType, in: query, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, properties: {file: {type: string, format: binary}}}
      responses:
        "201":
          description: stored (scanStatus CLEAN or quarantined INFECTED)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApplicationDocument"}
  /approvals/ladder:
    get:
      tags: [approvals]
      summary: The 7-level approval ladder (bank-tunable config rows)
      responses:
        "200":
          description: list envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/LadderRung"}}
                  meta: {$ref: "#/components/schemas/Meta"}
  /approvals/my-inbox:
    get:
      tags: [approvals]
      summary: Approver inbox (03) — OPEN tasks whose ladder level matches the caller's realm roles (admin sees all)
      responses:
        "200":
          description: list envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/InboxItem"}}
                  meta: {$ref: "#/components/schemas/Meta"}
  /approvals/current/{applicationId}:
    get:
      tags: [approvals]
      summary: Current approval task (node, role, phase, SLA)
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: current task, content: {application/json: {schema: {$ref: "#/components/schemas/ApprovalTask"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /approvals/{taskId}/act:
    post:
      tags: [approvals]
      summary: Act on a task (APPROVE|REJECT|RETURN|ESCALATE|DELEGATE|APPROVE_WITH_CONDITIONS); actor = JWT sub (body actor ignored); caller's realm role must cover the ladder level; maker-checker enforced on dual nodes; DELEGATE reassigns in place (SLA keeps running, only the delegate may act after); APPROVE_WITH_CONDITIONS records one condition per remark line — rows gate disbursement until SATISFIED/WAIVED
      parameters: [{name: taskId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [action], properties: {action: {type: string, enum: [APPROVE, REJECT, RETURN, ESCALATE, DELEGATE, APPROVE_WITH_CONDITIONS]}, actor: {type: string, description: ignored — audited actor is the JWT sub}, remark: {type: string, description: "DELEGATE note, or one condition per line for APPROVE_WITH_CONDITIONS"}, delegateTo: {type: string, description: "required for DELEGATE - the user id taking over the open task"}}}
      responses:
        "200":
          description: outcome
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /approvals/conditions/{applicationId}:
    get:
      tags: [approvals]
      summary: Conditions precedent recorded on an application's approvals (Q1.3) — PENDING rows block disbursement
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: list envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ApprovalCondition"}}
                  meta: {$ref: "#/components/schemas/Meta"}
  /approvals/conditions/{conditionId}/resolve:
    post:
      tags: [approvals]
      summary: Resolve a condition precedent — SATISFIED (evidence on file) or WAIVED (documented override); single-shot
      parameters: [{name: conditionId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [status], properties: {status: {type: string, enum: [SATISFIED, WAIVED]}, remark: {type: string}}}
      responses:
        "200": {description: resolved condition, content: {application/json: {schema: {$ref: "#/components/schemas/ApprovalCondition"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /customers:
    get:
      tags: [customers]
      summary: List customers (paginated, branch-scoped by token)
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 25, maximum: 100}}
      responses:
        "200":
          description: page of customers
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerPage"}
    post:
      tags: [customers]
      summary: Create customer (creates Fineract client via adapter; NID stored masked; audit CUSTOMER_CREATED)
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomerCreate"}
            examples:
              retail:
                value: {nameEn: "Md. Rafiqul Islam", nameBn: "মোঃ রফিকুল ইসলাম", segment: RETAIL, mobile: "+8801712345678", branchCode: "BR-001"}
      responses:
        "201":
          description: "created (replays carry Idempotent-Replay: true)"
          headers:
            Idempotent-Replay: {schema: {type: string, enum: ["true"]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
        "422": {$ref: "#/components/responses/Problem"}
  /customers/{idOrCif}:
    get:
      tags: [customers]
      summary: Customer 360 aggregate (accepts UUID or CIF number; applications + kycChecks + screeningHits)
      parameters: [{name: idOrCif, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: 360 view, content: {application/json: {schema: {$ref: "#/components/schemas/Customer360"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /customers/{id}/kyc-refresh:
    post:
      tags: [customers]
      summary: NIDW e-KYC refresh (mock adapter in P1); every attempt appends kyc_check history; gateway ERROR parks at PENDING (officer fallback)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [nid, dob], properties: {nid: {type: string}, dob: {type: string, format: date}}}
      responses:
        "200": {description: customer with new kycStatus, content: {application/json: {schema: {$ref: "#/components/schemas/Customer"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /customers/{id}/screen:
    post:
      tags: [customers]
      summary: Sanctions/PEP screening hook (06 §8) — hits persist and surface for compliance review; P1 default list is empty (CLEAR)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: screening result, content: {application/json: {schema: {$ref: "#/components/schemas/ScreeningResult"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /assessments/cib/file:
    post:
      tags: [assessments]
      summary: Monthly SFTP file channel (11 §1 parseFile) — same parser as real-time; deduped by (cif, period, file); raw stored encrypted (06 §5)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [cif, period, fileId, raw], properties: {cif: {type: string}, period: {type: string, description: YYYY-MM}, fileId: {type: string}, raw: {type: string, description: fixed-width file body}}}
      responses:
        "200": {description: pull status, content: {application/json: {schema: {$ref: "#/components/schemas/CibPull"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /assessments/cib/{cif}:
    post:
      tags: [assessments]
      summary: CIB pull (11 §1 — mock real-time in P2; dedupe by cif/period/file; malformed rows quarantined)
      parameters: [{name: cif, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: pull status, content: {application/json: {schema: {$ref: "#/components/schemas/CibPull"}}}}
    get:
      tags: [assessments]
      summary: Latest parsed report + facilities (CIB viewer)
      parameters: [{name: cif, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: detail, content: {application/json: {schema: {$ref: "#/components/schemas/CibDetail"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /assessments/{applicationId}/score:
    post:
      tags: [assessments]
      summary: (Re)run assessment — server-computed DBR (income + bureau installments + EMI oracle) + versioned scorecard
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssessmentFacts"}
      responses:
        "200": {description: outcome, content: {application/json: {schema: {$ref: "#/components/schemas/Score"}}}}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      tags: [assessments]
      summary: Latest stored score
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: score, content: {application/json: {schema: {$ref: "#/components/schemas/Score"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /assessments/{applicationId}/dbr:
    post:
      tags: [assessments]
      summary: DBR-only computation with the policy breakdown (income + bureau installments + EMI oracle)
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssessmentFacts"}
      responses:
        "200": {description: breakdown, content: {application/json: {schema: {$ref: "#/components/schemas/DbrBreakdown"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /assessments/{applicationId}/collateral:
    post:
      tags: [assessments]
      summary: Add collateral (valuation + insurance tracking)
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [type, valueMinor], properties: {type: {type: string, enum: [LAND, PROPERTY, FDR, MACHINERY, GUARANTEE]}, description: {type: string}, valueMinor: {type: integer}, valuedOn: {type: string, format: date}, insuredUntil: {type: string, format: date}}}
      responses:
        "200": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Collateral"}}}}
    get:
      tags: [assessments]
      summary: List collateral for an application
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Collateral"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /disbursements/{applicationId}/prepare:
    post:
      tags: [disbursements]
      summary: Prepare disbursement from a SANCTIONED application (actor = JWT sub; app → DISBURSEMENT stage)
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: PREPARED, content: {application/json: {schema: {$ref: "#/components/schemas/Disbursement"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /disbursements/{id}/authorize:
    post:
      tags: [disbursements]
      summary: Second-officer authorization — MUST be a different user than the preparer (409 ULMS-STATE-0001 otherwise)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: AUTHORIZED, content: {application/json: {schema: {$ref: "#/components/schemas/Disbursement"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /disbursements/{id}/release:
    post:
      tags: [disbursements]
      summary: Release (third officer) — Fineract approve+disburse, ULMS loan mirror created, app → DISBURSED; STR alert ≥ ৳10L
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: RELEASED with fineractTxnId, content: {application/json: {schema: {$ref: "#/components/schemas/Disbursement"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /disbursements/{id}:
    get:
      tags: [disbursements]
      summary: Disbursement detail with the dual-auth trail
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: detail, content: {application/json: {schema: {$ref: "#/components/schemas/Disbursement"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /disbursements/application/{applicationId}:
    get:
      tags: [disbursements]
      summary: Disbursement for an application
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: detail, content: {application/json: {schema: {$ref: "#/components/schemas/Disbursement"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /assessments/collateral/{collateralId}/valuation:
    post:
      tags: [assessments]
      summary: Revalue collateral — appends an immutable history row + updates current (04 §3)
      parameters: [{name: collateralId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [valueMinor], properties: {valueMinor: {type: integer}, valuedOn: {type: string, format: date}}}
      responses:
        "200": {description: updated collateral, content: {application/json: {schema: {$ref: "#/components/schemas/Collateral"}}}}
        "404": {$ref: "#/components/responses/Problem"}
    get:
      tags: [assessments]
      summary: Full valuation history (04 §3 collateral_valuation)
      parameters: [{name: collateralId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, valueMinor: {type: integer}, valuedOn: {type: string, nullable: true}, valuedBy: {type: string}, createdAt: {type: string}}}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /compliance/eod/run:
    post:
      tags: [compliance]
      summary: BRPD 15/2024 EOD batch (operator trigger; also scheduled 23:30) — idempotent per run-date with rerun semantics
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {date: {type: string, format: date}}}
      responses:
        "200": {description: run summary, content: {application/json: {schema: {$ref: "#/components/schemas/EodRun"}}}}
  /compliance/classification:
    get:
      tags: [compliance]
      summary: Classification board — latest run + loan portfolio + open STR alerts
      responses:
        "200": {description: board, content: {application/json: {schema: {$ref: "#/components/schemas/Board"}}}}
  /compliance/provision-calculator:
    get:
      tags: [compliance]
      summary: Provision calculator — the policy oracle shared with the frontend (03)
      parameters: [{name: classification, in: query, required: true, schema: {type: string}}, {name: outstandingMinor, in: query, required: true, schema: {type: integer}}]
      responses:
        "200": {description: provision, content: {application/json: {schema: {$ref: "#/components/schemas/ProvisionCalc"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /compliance/alerts:
    get:
      tags: [compliance]
      summary: Open compliance alerts (STR cash-threshold, CIB failures, recon mismatches)
      responses:
        "200": {description: alerts envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /compliance/returns:
    get:
      tags: [compliance]
      summary: Regcon board (P4) — the 12-row BB returns catalog × latest pack with statuses, sign-off chain state, and KPIs (due 30d, on-time streak, CAR, IFRS-9 runway)
      responses:
        "200": {description: board, content: {application/json: {schema: {$ref: "#/components/schemas/RegconBoard"}}}}
  /compliance/returns/{code}/generate:
    post:
      tags: [compliance]
      summary: Generate (or regenerate) a returns pack for a period — CL-1..CL-5, CIB-S, CIB-C, CAR, EDW, ECL, LLF; payload WORM-staged with sha256; preparer=system; CIB-R (continuous) is rejected; regenerate replaces the (code, period) wholesale
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, enum: [CL-1, CL-2, CL-3, CL-4, CL-5, CIB-S, CIB-C, CAR, EDW, ECL, LLF]}}
        - {name: period, in: query, required: false, schema: {type: string, pattern: '^\d{4}-\d{2}$'}, description: 'YYYY-MM; default = prior month (a 10-Oct return reports September)'}
      responses:
        "200": {description: generated pack summary, content: {application/json: {schema: {$ref: "#/components/schemas/ReturnGenerated"}}}}
        "422": {description: bad code / period (ULMS-VAL-0001)}
  /compliance/returns/{id}/signoff/check:
    post:
      tags: [compliance]
      summary: Checker sign-off — STAGED → CHECKED (06 §8 P4 chain preparer→checker→compliance); out-of-order ⇒ 409 ULMS-STATE-0001
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: checked}
        "409": {description: wrong stage in the chain}
  /compliance/returns/{id}/signoff/file:
    post:
      tags: [compliance]
      summary: Compliance sign-off + submission — CHECKED → FILED (submitted to Bangladesh Bank; submittedAt set)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: filed}
        "409": {description: wrong stage in the chain}
  /compliance/returns/{id}/file:
    get:
      tags: [compliance]
      summary: WORM-staged file download — CSV (CL/CAR/EDW/ECL/LLF) or fixed-width (CIB-S/CIB-C); rendered server-side (money in TAKA); X-ULMS-Sha256 header; checksum re-verified on read
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: file bytes, headers: {X-ULMS-Sha256: {schema: {type: string}}}}
  /compliance/provision-jv:
    post:
      tags: [compliance]
      summary: Post the EOD provision total to the Fineract GL as a zero-sum JV (03 "JV queue to Fineract GL") — debit provision expense, credit loan-loss reserve; idempotent per run-date; a drifted rerun total after posting ⇒ 409 + PROVISION_JV_DRIFT alert
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {date: {type: string, format: date}}}
      responses:
        "200": {description: "zero-sum entry incl. Fineract transaction id"}
        "409": {description: drift after posting — reversing entry is a bank process}
    get:
      tags: [compliance]
      summary: Latest posted provision JVs (zero-sum evidence chain)
      responses:
        "200": {description: entries, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /compliance/regcon-calendar:
    get:
      tags: [compliance]
      summary: BB submission calendar — upcoming due dates (continuous CIB-R excluded), each carrying the reporting period
      parameters: [{name: months, in: query, required: false, schema: {type: integer, default: 6, maximum: 24}}]
      responses:
        "200": {description: chronological dues, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CalendarDue"}}}}}
  /compliance/ifrs9/ecl:
    get:
      tags: [compliance]
      summary: IFRS-9 ECL runway board — snapshot rows per BRPD stage (PD/LGD/EAD, ECL vs BRPD provision) + months to the mandatory Dec-2027 date
      parameters: [{name: asOf, in: query, required: false, schema: {type: string, format: date}}]
      responses:
        "200": {description: ECL board, content: {application/json: {schema: {$ref: "#/components/schemas/EclBoard"}}}}
  /compliance/ifrs9/ecl/run:
    post:
      tags: [compliance]
      summary: Run (or rerun) the ECL snapshot for an as-of date — replaces that date's rows
      parameters: [{name: asOf, in: query, required: false, schema: {type: string, format: date}}]
      responses:
        "200": {description: run summary}
  /compliance/basel/car:
    get:
      tags: [compliance]
      summary: Basel III CAR inputs — RWA per BRPD class (standardized weights), CAR vs the 12.5% floor, buffer; eligible capital is a configured pilot input
      responses:
        "200": {description: CAR detail}
  /reporting/portfolio:
    get:
      tags: [compliance]
      summary: Portfolio read model (MV_LOAN_PORTFOLIO shape) — grouped aggregates for the Report Viewer; money in minor units
      parameters: [{name: groupby, in: query, required: false, schema: {type: string, enum: [classification, stage, branch], default: classification}}]
      responses:
        "200": {description: grouped aggregates}
        "422": {description: bad groupby (ULMS-VAL-0001)}
  /reporting/definitions:
    get:
      tags: [compliance]
      summary: Saved governed reports (12 W11 writer slice) — a definition binds the portfolio read model to a group-by
      responses:
        "200": {description: definitions, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      tags: [compliance]
      summary: Save a report definition (name 3–120 chars, unique; groupBy validated against the read model)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name, groupBy], properties: {name: {type: string}, groupBy: {type: string, enum: [classification, stage, branch]}, schedule: {type: string}}}
      responses:
        "200": {description: saved definition}
        "422": {description: bad name or groupBy}
        "409": {description: duplicate name}
  /reporting/definitions/{id}/run:
    get:
      tags: [compliance]
      summary: Execute a saved definition — runs the portfolio read model with its group-by (assembly-only, no free-form SQL)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: read-model result + definition}
        "404": {description: no such definition}
  /hooks/payments/{rail}:
    post:
      tags: [payments]
      summary: Rail callback (05 §7) — PUBLIC; HMAC-SHA256 over `timestamp "." rail "." rawBody` (±5 min; the rail path segment is INSIDE the MAC — P5 F8) IS the auth; idempotent by UTR; absent secret → 503 fail-closed
      security: []
      parameters: [{name: rail, in: path, required: true, schema: {type: string}}, {name: X-ULMS-Timestamp, in: header, required: true, schema: {type: string}}, {name: X-ULMS-Signature, in: header, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [utr, amountMinor, intentId], properties: {utr: {type: string}, amountMinor: {type: integer}, intentId: {type: string, format: uuid}}}
      responses:
        "200": {description: posted (replay=true on duplicate storms), content: {application/json: {schema: {type: object, properties: {status: {type: string}, paymentId: {type: string, format: uuid}, replay: {type: boolean}}}}}}
        "401": {description: bad signature}
        "403": {description: stale timestamp}
        "503": {description: webhook secret not configured}
  /loans:
    get:
      tags: [loans]
      summary: Loan portfolio (ULMS mirror)
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Loan"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /loans/{id}:
    get:
      tags: [loans]
      summary: Loan detail (outstanding, DPD, class, suspense, tenor, rate)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: loan, content: {application/json: {schema: {$ref: "#/components/schemas/Loan"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /loans/{id}/payments:
    post:
      tags: [payments]
      summary: Counter payment (staff) — idempotent by externalRef; Fineract repayment + mirror update in one tx (03)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [amountMinor], properties: {amountMinor: {type: integer}, externalRef: {type: string}, rail: {type: string, enum: [BKASH, NAGAD, ROCKET, BEFTN, CARD]}}}
      responses:
        "200": {description: posted, content: {application/json: {schema: {$ref: "#/components/schemas/Payment"}}}}
        "409": {$ref: "#/components/responses/Problem"}
    get:
      tags: [payments]
      summary: Payment history for a loan
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Payment"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /loans/{id}/payment-intents:
    post:
      tags: [payments]
      summary: Initiate a rail checkout → redirect URL (11 §3 redirect model — never card data)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [amountMinor, rail], properties: {amountMinor: {type: integer}, rail: {type: string, enum: [BKASH, NAGAD, BEFTN]}}}
      responses:
        "200": {description: intent with railUrl, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentIntent"}}}}
    get:
      tags: [payments]
      summary: Intents for a loan
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/PaymentIntent"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /loans/{id}/schedule:
    get:
      tags: [loans]
      summary: Amortization schedule — EMI-oracle derived, Σprincipal = principal (09 §3 parity)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/ScheduleLine"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /loans/{id}/statement:
    get:
      tags: [loans]
      summary: Statement page over the payment ledger — ?format=csv is byte-parity CSV; generations audited (statement_run)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {name: page, in: query, schema: {type: integer, default: 1}}, {name: size, in: query, schema: {type: integer, default: 25}}, {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}]
      responses:
        "200": {description: statement page (JSON) or text/csv attachment}
  /loans/{id}/settle-quote:
    post:
      tags: [loans]
      summary: Early-settlement quote (03 policy oracle) — penalty 2% inside 6-installment lock-in, rebate 50% of unearned interest ≥12 paid, valid 7 days
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: quote, content: {application/json: {schema: {$ref: "#/components/schemas/SettleQuote"}}}}
  /loans/{id}/reschedule-request:
    post:
      tags: [loans]
      summary: Record a reschedule request; approval regenerates the schedule tenor (03)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [newTenorMonths, reason], properties: {newTenorMonths: {type: integer, minimum: 3, maximum: 120}, reason: {type: string}}}
      responses:
        "200": {description: request, content: {application/json: {schema: {$ref: "#/components/schemas/Reschedule"}}}}
  /loans/reschedule/{requestId}/decision:
    post:
      tags: [loans]
      summary: Officer decision — approve updates the loan tenor (schedule regenerates)
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [approve], properties: {approve: {type: boolean}}}
      responses:
        "200": {description: decided, content: {application/json: {schema: {$ref: "#/components/schemas/Reschedule"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /loans/payments/reconcile:
    post:
      tags: [payments]
      summary: Reconciliation run (11 §3) — bank settlement lines vs posted payments; each mismatch raises a RECON_MISMATCH alert
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [settlements], properties: {settlements: {type: array, items: {type: object, required: [utr, amountMinor], properties: {utr: {type: string}, amountMinor: {type: integer}}}}}}
      responses:
        "200": {description: summary, content: {application/json: {schema: {type: object, properties: {lines: {type: integer}, matched: {type: integer}, mismatches: {type: integer}}}}}}
  /collections/worklist:
    get:
      tags: [collections]
      summary: Bucket worklist (03) — DPD>0 loans; priority P1 (broken PTP) / P2 (DPD>90) / P3; DPD desc
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/WorklistRow"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /collections/{loanId}/actions/{actionType}:
    post:
      tags: [collections]
