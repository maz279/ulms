        required: true
        content:
          application/json:
            schema: {type: object, required: [loanId, venue, scheduledFor, reserveMinor], properties: {loanId: {type: string, format: uuid}, collateralRef: {type: string}, venue: {type: string}, scheduledFor: {type: string, format: date-time}, reserveMinor: {type: integer}}}
      responses:
        "200": {description: entry, content: {application/json: {schema: {$ref: "#/components/schemas/AuctionEntry"}}}}
