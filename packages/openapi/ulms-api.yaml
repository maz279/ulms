    post:
      tags: [collections]
      summary: Record a no-sale
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: entry, content: {application/json: {schema: {$ref: "#/components/schemas/AuctionEntry"}}}}
  /collections/auctions/{id}/cancel:
    post:
      tags: [collections]
      summary: Cancel an auction (sold auctions are immutable)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: entry, content: {application/json: {schema: {$ref: "#/components/schemas/AuctionEntry"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /collections/{loanId}/legal-case:
    post:
      tags: [collections]
      summary: File a legal case (03 recovery & legal case tracking)
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [claimMinor], properties: {court: {type: string}, filedOn: {type: string, format: date}, claimMinor: {type: integer}, lawyer: {type: string}, notes: {type: string}}}
      responses:
        "200": {description: case, content: {application/json: {schema: {$ref: "#/components/schemas/LegalCase"}}}}
    get:
      tags: [collections]
      summary: Legal cases for a loan
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/LegalCase"}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /collections/legal-case/{caseId}/status:
    post:
      tags: [collections]
      summary: Update case status (FILED→ONGOING→WON|LOST|WITHDRAWN)
      parameters: [{name: caseId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [status], properties: {status: {type: string, enum: [FILED, ONGOING, WON, LOST, WITHDRAWN]}}}
      responses:
        "200": {description: case, content: {application/json: {schema: {$ref: "#/components/schemas/LegalCase"}}}}
  /collections/{loanId}/waive-interest:
    post:
      tags: [collections]
      summary: Collections resolution adjustment (03 Fineract row) — waive interest via Fineract transaction; mirror-only migrated loans reject 409
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [amountMinor], properties: {amountMinor: {type: integer}}}
      responses:
        "200": {description: txn, content: {application/json: {schema: {type: object, properties: {fineractTxn: {type: integer}}}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /portal/me/loans/{loanId}/statement.csv:
    get:
      tags: [portal]
      summary: Borrower statement download (08 B1) — CSV attachment
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: text/csv attachment}
  /loans/{id}/fees:
    post:
      tags: [payments]
      summary: Charge a fee on the loan (03 repayment/fee/waiver triple) — Fineract loan charge (charge def 1 = ULMS Penalty Fee)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [amountMinor], properties: {amountMinor: {type: integer}, chargeName: {type: string}}}
      responses:
        "200": {description: charge, content: {application/json: {schema: {type: object, properties: {fineractCharge: {type: integer}}}}}}
        "422": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /portal/me:
    get:
      tags: [portal]
      summary: Borrower own-CIF lookup by registered mobile → loan cards (balance+EMI+nextDue, 08 B1)
      parameters: [{name: mobile, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: portal home, content: {application/json: {schema: {type: object, properties: {cifNo: {type: string}, nameEn: {type: string}, kycStatus: {type: string}, loans: {type: array, items: {type: object}}}}}}}
  /portal/me/application:
    get:
      tags: [portal]
      summary: Application tracker — read projection of the SAME workflow tables (08 B2, no second truth)
      parameters: [{name: cif, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: list envelope}
  /portal/me/payments:
    get:
      tags: [portal]
      summary: Own payment history for a loan
      parameters: [{name: loanId, in: query, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope}
  /portal/me/payments/initiate:
    post:
      tags: [portal]
      summary: Initiate a payment → rail redirect URL (no card data through ULMS, 08 B2)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [loanId, amountMinor, rail], properties: {loanId: {type: string, format: uuid}, amountMinor: {type: integer}, rail: {type: string, enum: [BKASH, NAGAD, ROCKET, BEFTN, CARD], description: allowlist (P5 F5)}}}
      responses:
        "200": {description: intent, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentIntent"}}}}
  /certificates/tax/{year}:
    get:
      tags: [loans]
      summary: Tax certificate — interest paid per loan for the year (03 mod-servicing)
      parameters: [{name: year, in: path, required: true, schema: {type: integer}}, {name: cif, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object, properties: {cifNo: {type: string}, nameEn: {type: string}, year: {type: integer}, loanNo: {type: string}, interestPaidMinor: {type: integer}, totalPaidMinor: {type: integer}}}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}

  # ================= R3 (v1.6) — origination completion =================
  /products:
    get:
      tags: [platform]
      summary: "Loan-product catalog (R3): bilingual info, amounts/tenors, rates, charges, security rules"
      parameters: [{name: includeInactive, in: query, required: false, schema: {type: boolean, default: false}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
    post:
      tags: [platform]
      summary: "Create product version (maker-checker; admin)"
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {type: object}}}}
        "409": {description: "a live version (DRAFT or ACTIVE) already exists for the code — activate/supersede instead"}
  /products/{code}:
    get:
      tags: [platform]
      summary: Product by code (versioned)
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: product, content: {application/json: {schema: {type: object}}}}
    patch:
      tags: [platform]
      summary: Amend draft product (admin)
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: updated, content: {application/json: {schema: {type: object}}}}}
  /products/{code}/activate:
    post:
      tags: [platform]
      summary: Activate a product version (deactivates the previous active one)
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: activated, content: {application/json: {schema: {type: object}}}}}
  /products/{code}/eligibility:
    get:
      tags: [platform]
      summary: Eligibility pre-check (amount/tenor bounds + EMI preview)
      parameters: [{name: code, in: path, required: true, schema: {type: string}}, {name: amountMinor, in: query, required: true, schema: {type: integer}}, {name: tenorMonths, in: query, required: true, schema: {type: integer}}]
      responses:
        "200": {description: eligibility, content: {application/json: {schema: {type: object}}}}
  /sanctions:
    get:
      tags: [approval]
      summary: Recent letters (page rehydration; newest first)
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /sanctions/{applicationId}/generate:
    post:
      tags: [approval]
      summary: "Generate the bilingual sanction letter on SANCTION (R3; renders EN+BN, tracks acceptance)"
      parameters: [{name: applicationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"201": {description: letter, content: {application/json: {schema: {type: object}}}}}
  /sanctions/{id}:
    get:
      tags: [approval]
      summary: Letter by id (status, acceptance token presence, body refs)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: letter, content: {application/json: {schema: {type: object}}}}}
  /sanctions/{id}/accept:
    post:
      tags: [approval]
      summary: Customer acceptance via tokenized link (portal) — records signed-at
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {name: token, in: query, required: true, schema: {type: string}}]
      responses: {"200": {description: accepted, content: {application/json: {schema: {type: object}}}}}
  /sanctions/{id}/resend:
    post:
      tags: [approval]
      summary: Resend letter (SMS/email dispatch + branch copy) — audit
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: resent, content: {application/json: {schema: {type: object}}}}}
  /bocc/meetings:
    get:
      tags: [approval]
      summary: "BOCC meetings (R3): calendar + status"
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
    post:
      tags: [approval]
      summary: Schedule a sitting (branch, date, members) — agenda auto-built from pending cases
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: meeting, content: {application/json: {schema: {type: object}}}}}
  /bocc/meetings/{id}:
    get:
      tags: [approval]
      summary: Meeting detail — agenda cases, attendance, votes, minutes state
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: meeting, content: {application/json: {schema: {type: object}}}}}
  /bocc/meetings/{id}/attendance:
    post:
      tags: [approval]
      summary: Check-in a member (digital signature)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: recorded, content: {application/json: {schema: {type: object}}}}}
  /bocc/meetings/{id}/vote:
    post:
      tags: [approval]
      summary: Vote on an agenda case (APPROVE/REJECT/HOLD/DEFER + dissent note)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: vote, content: {application/json: {schema: {type: object}}}}}
  /bocc/meetings/{id}/close:
    post:
      tags: [approval]
      summary: Close sitting — auto-minutes draft, quorum enforced, resolutions routed
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: minutes, content: {application/json: {schema: {type: object}}}}}
  /outbox:
    get:
      tags: [platform]
      summary: "Transactional outbox (ADR-004, R3): pending/relayed events — admin ops view"
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /outbox/relay:
    post:
      tags: [platform]
      summary: Drain the outbox (scheduled in prod; manual for ops drills)
      responses: {"200": {description: relay result, content: {application/json: {schema: {type: object}}}}}

  # ================= R4 (v1.7) — depth =================
  /collections/{loanId}/write-off:
    post:
      tags: [collections]
      summary: "Propose write-off (R4): board-band validation, provision state pinned"
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: case, content: {application/json: {schema: {type: object}}}}}
  /write-offs:
    get:
      tags: [collections]
      summary: Write-off register (CL-4 feed)
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /write-offs/{id}/approve:
    post:
      tags: [collections]
      summary: Committee approval — GL write-off JV + CIB flag + outstanding zeroing
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: approved, content: {application/json: {schema: {type: object}}}}}
  /write-offs/{id}/reverse:
    post:
      tags: [collections]
      summary: Reverse an executed write-off (recovery received after write-off)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: reversed, content: {application/json: {schema: {type: object}}}}}
  /collections/{loanId}/recoveries:
    get:
      tags: [collections]
      summary: Recovery ledger for a loan (CL-3 feed)
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
    post:
      tags: [collections]
      summary: Record a recovery receipt (incentive computed per policy)
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: entry, content: {application/json: {schema: {type: object}}}}}
  /customers/{survivorCif}/merge-duplicate:
    post:
      tags: [customers]
      summary: "Merge a duplicate CIF into the survivor (R10 P-B) — idempotent, re-points applications/loans/guarantors/collateral"
      parameters: [{name: survivorCif, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: merge counts}
        "409": {description: duplicate already merged into a different survivor}
        "422": {description: duplicateCif required / self-merge rejected}
  /customers/{cif}/risk:
    post:
      tags: [customers]
      summary: "Update the AML risk class (R10 P-B) — drives EDD posture and the 1/2/3-year KYC refresh cycle"
      parameters: [{name: cif, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: updated}, "422": {description: "risk must be Low, Medium or High"}}
  /customers/{customerId}/collateral:
    get:
      tags: [assessment]
      summary: "Collateral portfolio of a customer (R10 P-C registry)"
      parameters: [{name: customerId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: list envelope}}
    post:
      tags: [assessment]
      summary: "Register a security — valuation ≤ 1 year, FSV ≤ MV enforced (USER-CR §5)"
      parameters: [{name: customerId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: registered}
        "422": {description: valuation stale/future-dated or FSV exceeds MV}
  /customers/{customerId}/collateral/ltv:
    get:
      tags: [assessment]
      summary: "LTV verdict for an exposure — breach raises the approval-condition event"
      parameters: [{name: customerId, in: path, required: true, schema: {type: string, format: uuid}},
                   {name: exposureMinor, in: query, required: true, schema: {type: integer}},
                   {name: productMaxLtvBp, in: query, required: false, schema: {type: integer, default: 0}}]
      responses: {"200": {description: "verdict — realizable, acceptable, breach flag"}}
  /compliance/basel/summary:
    get:
      tags: [compliance]
      summary: "Basel RWA/CAR inputs, segment split, leverage and single-borrower breaches (R10 P-F)"
      responses: {"200": {description: summary object}}
  /compliance/regcon/push:
    post:
      tags: [compliance]
      summary: "Operator trigger for the regcon transmission + GL reconciliation pass (drills)"
      responses: {"200": {description: "{ transmitted: n }"}}
  /servicing/blr:
    get:
      tags: [servicing]
      summary: "Current active BLR in bp (R10 P-E floating-rate anchor)"
      responses: {"200": {description: "{ rateBp }"}}
    post:
      tags: [servicing]
      summary: "Apply a new BLR (admin/treasury) — every FLOATING loan re-prices to BLR+spread with RATE_REPRICED notifications"
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: "reprice summary — from/to bp and loans repriced"}
        "422": {description: rateBp must be positive}
  /servicing/loans/{loanId}/moratorium:
    post:
      tags: [servicing]
      summary: "Grant a 1–12 month moratorium — paused interest capitalizes into outstanding (R10 P-E)"
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: updated loan}
        "409": {description: moratorium applies to ACTIVE loans only}
        "422": {description: months must be 1–12}
  /servicing/loans/{loanId}/top-up:
    post:
      tags: [servicing]
      summary: "Top-up a running loan — combined exposure raises principal+outstanding, schedule regenerates (R10 P-E)"
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: updated loan}
        "409": {description: top-up applies to ACTIVE loans only}
        "422": {description: amountMinor must be positive}
  /customers/{idOrCif}/goaml/submit:
    post:
      tags: [customers]
      summary: "Submit the customer's goAML XML to the BFIU portal (Q3.3) — values-only flip; 409 with guidance until ULMS_GOAML_URL/TOKEN are set"
      parameters: [{name: idOrCif, in: path, required: true, schema: {type: string}}]
      responses:
        "202": {description: accepted with bfiu_ack}
        "409": {description: submission not configured — export via goaml.xml remains available}
        "502": {description: BFIU portal rejected the POST}
  /goaml/submissions:
    get:
      tags: [customers]
      summary: "goAML submission log per CIF (Q3.3)"
      parameters: [{name: cif, in: query, required: true, schema: {type: string}}]
      responses: {"200": {description: list envelope}}
  /compliance/basel/parallel/snapshot:
    post:
      tags: [compliance]
      summary: "Snapshot ULMS Basel metrics for a period (Q3.7 parallel-run; idempotent upsert)"
      parameters: [{name: period, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: "{ period, metricsSnapshotted }"}
        "422": {description: "period must be a valid YYYY-MM"}
  /compliance/basel/parallel/bank-value:
    post:
      tags: [compliance]
      summary: "Record the bank's current-return value + variance note against a ULMS snapshot (Q3.7)"
      parameters: [{name: period, in: query, required: true, schema: {type: string}},
                   {name: metric, in: query, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: updated row}
        "404": {description: no ULMS snapshot for the metric — snapshot first}
  /compliance/basel/parallel/report:
    get:
      tags: [compliance]
      summary: "Side-by-side parallel-run comparison report (markdown) — two quarters of rows are the go-live evidence"
      parameters: [{name: period, in: query, required: false, schema: {type: string}}]
      responses: {"200": {description: markdown report}}
  /portal/otp:
    post:
      tags: [portal]
      summary: "Portal OTP issue (R10): 6-digit code, 5-min TTL, ≤5 attempts, one live code per mobile"
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "202": {description: issued (never the code itself in production; dev-mode mock surfaces devCode)}
        "429": {description: an active code already exists for the mobile}
        "422": {description: BD mobile required}
  /portal/otp/verify:
    post:
      tags: [portal]
      summary: "Portal OTP verify — consumes the code and returns the confirmation token"
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: "{ otpToken }"}
        "401": {description: no active code / expired / mismatch}
        "429": {description: too many attempts}
  /customers/{idOrCif}/guarantors:
    get:
      tags: [customers]
      summary: Guarantor registry for a customer (R4)
      parameters: [{name: idOrCif, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
    post:
      tags: [customers]
      summary: Attach a guarantor (CIB check via assessment port)
      parameters: [{name: idOrCif, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: guarantor, content: {application/json: {schema: {type: object}}}}}
  /notifications/templates:
    get:
      tags: [platform]
      summary: "Notification templates (R4): BN/EN pairs by trigger type"
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
    post:
      tags: [platform]
      summary: Upsert a template (maker-checker; admin)
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: template, content: {application/json: {schema: {type: object}}}}}
  /notifications/outbox:
    get:
      tags: [platform]
      summary: Notification delivery log (status per channel)
      responses:
        "200": {description: list envelope, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {$ref: "#/components/schemas/Meta"}}}}}}
  /notifications/send:
    post:
      tags: [platform]
      summary: Render + dispatch a template to a recipient (SMS/email port)
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: delivery, content: {application/json: {schema: {type: object}}}}}
  /customers/{idOrCif}/aml:
    get:
      tags: [customers]
      summary: AML posture — CDD/EDD flag, list hits, STR drafts (R4)
      parameters: [{name: idOrCif, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: posture, content: {application/json: {schema: {type: object}}}}}
  /customers/{idOrCif}/str:
    post:
      tags: [customers]
      summary: File/record an STR (BFIU export shape)
      parameters: [{name: idOrCif, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: str, content: {application/json: {schema: {type: object}}}}}

  # ================= R5 — portal & partner =================
  /portal/me/applications:
    post:
      tags: [portal]
      summary: "Borrower self-service application (R5): mobile-identified, product from catalog"
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: application, content: {application/json: {schema: {type: object}}}}}
  /portal/me/documents:
    post:
      tags: [portal]
      summary: Borrower document upload (checksum + scan passthrough in dev)
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: document, content: {application/json: {schema: {type: object}}}}}
  /portal/me/loans/{loanId}/statement:
    get:
      tags: [portal]
      summary: Statement browse (JSON rows; CSV via format=csv)
      parameters: [{name: loanId, in: path, required: true, schema: {type: string, format: uuid}}, {name: format, in: query, required: false, schema: {type: string, enum: [json, csv]}}]
      responses: {"200": {description: statement, content: {application/json: {schema: {type: object}}}}}
  /partner/applications:
    post:
      tags: [platform]
      summary: "Partner API intake (R5): X-Api-Key identified, rate-limited, idempotent"
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: application, content: {application/json: {schema: {type: object}}}}}
  /partner/applications/{id}/status:
    get:
      tags: [platform]
      summary: Partner status poll (tracker projection)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: status, content: {application/json: {schema: {type: object}}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Problem:
      description: error
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string, description: "stable code — registry docs/errors.md (ULMS-NOT-FOUND, ULMS-FORBIDDEN, ULMS-VAL-0001, ULMS-STATE-0001)"}
        detail: {type: string}
        requestId: {type: string, format: uuid}
        fields:
          type: array
          items:
            type: object
            properties: {path: {type: string}, code: {type: string}, message: {type: string}, messageBn: {type: string}}
    Meta:
      type: object
      properties:
        requestId: {type: string, format: uuid}
        page: {type: integer}
