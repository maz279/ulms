# ULMS OpenAPI lint policy (audit R1 verification pass)
# Struct errors are fatal by default. Style rules the contract never adopted
# are explicitly OFF so the gate is deterministic; flipping one on requires
# fixing the contract first — do not downgrade rules to pass a build.
extends:
  - recommended
rules:
  # not adopted: 88 legacy operations lack operationIds (clients import paths
  # directly); adopt during the R3 OpenAPI v1.6 revision
  operation-operationId: off
  # not adopted: this internal contract returns problem+json envelopes on 4xx
  # via the shared handler; per-operation 4xx docs land with R3 v1.6
  operation-4xx-response: off
  # 11 tags: descriptions live in the docs, not the yaml (keep light)
  tag-description: off
  # /portal/me/* vs /portal/me — intentional REST nesting, not ambiguity
  no-ambiguous-paths: off
  # internal bank system: license + example-server rules don't apply
  info-license: off
  no-server-example.com: off
